# CAN-FD Network Architecture and Message Baseline (DBC-style)
bus:
  name: "Powertrain-Chassis-FD"
  nominal_bitrate_kbps: 500
  data_bitrate_kbps: 2000
  fd_enabled: true

messages:
  - id: 0x100
    name: "VehicleSpeed"
    description: "Wheel speeds and derived longitudinal vehicle velocity"
    period_ms: 10
    dlc: 8
    bytes: 8
    signals:
      - name: "speed_kph"
        start_byte: 0
        num_bytes: 2
        min_val: 0.0
        max_val: 250.0
        scale: 0.01
        offset: 0.0
        unit: "km/h"
      - name: "acceleration_mps2"
        start_byte: 2
        num_bytes: 2
        min_val: -15.0
        max_val: 15.0
        scale: 0.001
        offset: 0.0
        unit: "m/s^2"
      - name: "counter"
        start_byte: 4
        num_bytes: 1
        min_val: 0
        max_val: 255
        scale: 1
        offset: 0
        unit: "count"
      - name: "checksum"
        start_byte: 5
        num_bytes: 1
        min_val: 0
        max_val: 255
        scale: 1
        offset: 0
        unit: "crc"

  - id: 0x101
    name: "EngineTemp"
    description: "Powertrain thermal status (coolant and oil)"
    period_ms: 100
    dlc: 8
    bytes: 8
    signals:
      - name: "coolant_temp_c"
        start_byte: 0
        num_bytes: 2
        min_val: -40.0
        max_val: 150.0
        scale: 0.1
        offset: -40.0
        unit: "degC"
      - name: "oil_temp_c"
        start_byte: 2
        num_bytes: 2
        min_val: -40.0
        max_val: 160.0
        scale: 0.1
        offset: -40.0
        unit: "degC"
      - name: "fan_duty_pct"
        start_byte: 4
        num_bytes: 1
        min_val: 0
        max_val: 100
        scale: 1
        offset: 0
        unit: "%"

  - id: 0x102
    name: "BrakeStatus"
    description: "Hydraulic pressure, pedal displacement, ABS intervention"
    period_ms: 20
    dlc: 8
    bytes: 8
    signals:
      - name: "pedal_pos_pct"
        start_byte: 0
        num_bytes: 1
        min_val: 0
        max_val: 100
        scale: 1
        offset: 0
        unit: "%"
      - name: "pressure_bar"
        start_byte: 1
        num_bytes: 2
        min_val: 0
        max_val: 250
        scale: 0.1
        offset: 0
        unit: "bar"
      - name: "abs_active"
        start_byte: 3
        num_bytes: 1
        min_val: 0
        max_val: 1
        scale: 1
        offset: 0
        unit: "bool"

  - id: 0x103
    name: "SteeringAngle"
    description: "Steering column optical encoder angle and angular velocity"
    period_ms: 10
    dlc: 8
    bytes: 8
    signals:
      - name: "angle_deg"
        start_byte: 0
        num_bytes: 2
        min_val: -720.0
        max_val: 720.0
        scale: 0.1
        offset: -720.0
        unit: "deg"
      - name: "rot_rate_dps"
        start_byte: 2
        num_bytes: 2
        min_val: -1000.0
        max_val: 1000.0
        scale: 0.1
        offset: -1000.0
        unit: "deg/s"

  - id: 0x200
    name: "BatteryStatus"
    description: "High voltage traction pack state of charge and electrical metrics"
    period_ms: 500
    dlc: 10
    bytes: 16
    signals:
      - name: "state_of_charge_pct"
        start_byte: 0
        num_bytes: 2
        min_val: 0.0
        max_val: 100.0
        scale: 0.01
        offset: 0.0
        unit: "%"
      - name: "voltage_v"
        start_byte: 2
        num_bytes: 2
        min_val: 0.0
        max_val: 800.0
        scale: 0.1
        offset: 0.0
        unit: "V"
      - name: "current_a"
        start_byte: 4
        num_bytes: 2
        min_val: -500.0
        max_val: 500.0
        scale: 0.1
        offset: -500.0
        unit: "A"
      - name: "max_cell_temp_c"
        start_byte: 6
        num_bytes: 1
        min_val: -40
        max_val: 100
        scale: 1
        offset: -40
        unit: "degC"

  - id: 0x201
    name: "VehicleDiagnostics"
    description: "UDS / OBD-II status and DTC broadcast buffer"
    period_ms: 1000
    dlc: 13
    bytes: 32
    signals:
      - name: "dtc_count"
        start_byte: 0
        num_bytes: 1
        min_val: 0
        max_val: 16
        scale: 1
        offset: 0
        unit: "count"
      - name: "odometer_km"
        start_byte: 1
        num_bytes: 4
        min_val: 0
        max_val: 1000000
        scale: 1
        offset: 0
        unit: "km"
