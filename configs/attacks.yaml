# Attack Profiles and Scheduling Configuration
# Attack Types:
# 0: Normal
# 1: DoS
# 2: Fuzzing
# 3: Spoofing
# 4: Replay
# 5: Suppression
# Protocol corruption is handled deterministically via protocol validator (REQ-06)

attacks:
  - name: "DoS_Flood"
    type: 1
    description: "High-priority dominant frame flooding to saturate bus arbitration"
    start_ms: 1000
    duration_ms: 800
    target_id: 0x050
    interval_us: 500          # 2000 frames/sec flood rate
    dlc: 8
    payload_pattern: [0xDE, 0xAD, 0xBE, 0xEF, 0x00, 0x00, 0x00, 0x00]

  - name: "Fuzzing_Random"
    type: 2
    description: "Random ID and payload injection to discover ECU vulnerabilities"
    start_ms: 2500
    duration_ms: 1000
    interval_us: 2000         # 500 frames/sec
    id_range: [0x000, 0x7FF]
    dlc_range: [0, 15]

  - name: "Spoofing_Brake"
    type: 3
    description: "Counterfeit BrakeStatus frames with conflicting pedal values and irregular timing"
    start_ms: 4500
    duration_ms: 1000
    target_id: 0x102
    interval_us: 7000         # Abnormal period (normal is 20ms = 20,000us)
    dlc: 8
    spoofed_signals:
      pedal_pos_pct: 100
      pressure_bar: 220.0
      abs_active: 1

  - name: "Replay_Steering"
    type: 4
    description: "Verbatim replay of previously recorded SteeringAngle frames"
    start_ms: 6500
    duration_ms: 1000
    target_id: 0x103
    capture_start_ms: 500
    capture_duration_ms: 1000
    replay_offset_ms: 6000

  - name: "Suppression_Brake"
    type: 5
    description: "Denial of message reception by suppressing periodic 0x102 BrakeStatus frames"
    start_ms: 8000
    duration_ms: 1200
    target_id: 0x102

protocol_corruption_test_suite:
  - name: "CRC_Bit_Inversion"
    test_id: "TST-006-1"
    corrupt_field: "CRC"
    bit_index: 2
    operation: "invert"

  - name: "Dynamic_Stuff_Violation"
    test_id: "TST-006-2"
    corrupt_field: "DATA"
    operation: "insert_consecutive_bits"
    count: 6

  - name: "Fixed_Stuff_Bit_Inversion"
    test_id: "TST-006-3"
    corrupt_field: "CRC_STUFF_BIT"
    index: 0
    operation: "invert"

  - name: "Invalid_DLC_Value"
    test_id: "TST-006-4"
    corrupt_field: "DLC_LOGICAL_INGRESS"
    invalid_value: 0xFF
    note: "A physical DLC is four bits; reject invalid values before serialization."

  - name: "ACK_Delimiter_Violation"
    test_id: "TST-006-5"
    corrupt_field: "ACK_DELIMITER"
    operation: "force_dominant"
